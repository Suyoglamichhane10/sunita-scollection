# ============================================================
# Nginx reverse proxy for Sunita's Collection (Node deployment)
#
# Place this file at:  /etc/nginx/sites-available/sunitas-collection
# Symlink to:          /etc/nginx/sites-enabled/sunitas-collection
#
# This config assumes:
#   - Client build is at /var/www/sunitas-collection/client/dist
#   - API server (PM2) is listening on 127.0.0.1:5000
#   - SSL certificate is set up (Let's Encrypt recommended)
# ============================================================

# HTTP -> HTTPS redirect (optional; remove if not using SSL)
server {
    listen 80;
    listen [::]:80;
    server_name your_domain.com;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your_domain.com;

    # --- SSL Configuration ---
    ssl_certificate /etc/letsencrypt/live/your_domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your_domain.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/your_domain.com/chain.pem;

    # --- Security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # --- Client build static files ---
    root /var/www/sunitas-collection/client/dist;
    index index.html;

    # --- Gzip compression ---
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # --- API requests: proxy to PM2 Node server ---
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Socket.IO support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Uploaded files (served by Express) ---
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
    }

    # --- SPA fallback: serve index.html for non-API routes ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
