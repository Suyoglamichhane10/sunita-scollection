services:
  - type: web
    name: sunitaz-backend
    runtime: node
    buildCommand: "npm install --omit=dev"
    startCommand: "node src/server.js"
    rootDir: server
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: "7d"
      - key: SESSION_SECRET
        sync: false
      - key: FRONTEND_URL
        value: "https://sunitacollection-frontend.vercel.app,http://localhost:5173,http://localhost:3000"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_SECURE
        value: "false"
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        value: "Sunita's Collection <no-reply@sunitacollection.com>"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ESEWA_ENV
        value: "test"
      - key: ESEWA_PRODUCT_CODE
        value: "EPAYTEST"
      - key: ESEWA_SECRET_KEY
        sync: false
      - key: FONEPAY_ENV
        value: "test"
      - key: FONEPAY_MERCHANT_ID
        sync: false
      - key: FONEPAY_MERCHANT_SECRET
        sync: false
      - key: FONEPAY_APP_ID
        sync: false
      - key: FONEPAY_PRODUCT_CODE
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: "https://sunitaz-backend.onrender.com/api/auth/google/callback"
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: WHATSAPP_PHONE_NUMBER
        sync: false
      - key: WHATSAPP_BUSINESS_TOKEN
        sync: false
      - key: WHATSAPP_ADMIN_NUMBER
        value: "9779768562128"
