services:
  api:
    build: ./server
    env_file: ./server/.env
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
  web:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - api
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  mongo-data:
